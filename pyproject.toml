[project]
name = "apex"
version = "0.1.0"
description = "APEX: a selective, risk-first autonomous trading system (paper trading by default)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "numpy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.0",
    "scikit-learn>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.setuptools.package-data]
apex = ["api/static/*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
ml = ["scikit-learn>=1.5", "xgboost>=2.0"]
dl = ["scikit-learn>=1.5", "torch>=2.4"]

[project.scripts]
apex = "apex.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
